name: DividendOS quality gate

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            v4/package-lock.json
            toss-bridge/package-lock.json
      - name: Install DividendOS tooling
        working-directory: v4
        run: npm ci
      - name: Run FAST quality gate
        working-directory: v4
        run: npm run qa:fast

  core:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            v4/package-lock.json
            toss-bridge/package-lock.json
      - name: Install DividendOS tooling
        working-directory: v4
        run: npm ci
      - name: Run CORE quality gate
        working-directory: v4
        run: npm run qa:core
      - name: Install Toss bridge dependencies
        working-directory: toss-bridge
        run: npm ci
      - name: Verify Toss bridge
        working-directory: toss-bridge
        run: npm run verify
      - name: Build and smoke-test Toss bridge container
        working-directory: toss-bridge
        run: |
          docker build -t dividend-os-toss-bridge:qa .
          docker run --rm -d --name dividend-os-toss-bridge-qa \
            -p 127.0.0.1:18080:8080 \
            -e TOSS_CLIENT_ID=qa-client \
            -e TOSS_CLIENT_SECRET=qa-secret \
            -e FIREBASE_PROJECT_ID=qa-project \
            -e ALLOWED_FIREBASE_UID=qa_owner \
            -e ALLOWED_ORIGIN=https://dttg123.github.io \
            dividend-os-toss-bridge:qa
          trap 'docker logs dividend-os-toss-bridge-qa; docker stop dividend-os-toss-bridge-qa' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/health | grep --quiet '"mode":"read-only"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Audit production dependencies
        working-directory: toss-bridge
        run: npm audit --omit=dev --audit-level=high
      - name: Audit DividendOS dependencies
        working-directory: v4
        run: npm audit --audit-level=high

  android:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install DividendOS tooling
        working-directory: v4
        run: npm ci
      - name: Sync Android project
        working-directory: v4
        run: npm run android:sync
      - name: Build debug APK
        working-directory: v4/android
        run: ./gradlew assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DividendOS-Android-debug
          path: v4/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - name: Install DividendOS tooling
        working-directory: v4
        run: npm ci
      - name: Install Chromium
        working-directory: v4
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop browser QA
        working-directory: v4
        run: npm run qa:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: v4/test-results
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - name: Install DividendOS tooling
        working-directory: v4
        run: npm ci
      - name: Run RELEASE quality gate
        working-directory: v4
        run: npm run qa:release
      - name: Verify Q3 device, restore, rollback, and cleanup evidence
        working-directory: v4
        env:
          QA_RELEASE_EVIDENCE_JSON: ${{ vars.QA_RELEASE_EVIDENCE_JSON }}
        run: npm run qa:release:evidence
