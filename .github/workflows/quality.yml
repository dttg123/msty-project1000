name: DividendOS quality gate

on:
  workflow_dispatch:
    inputs:
      lifetime_ui:
        description: 'Run 30-year individual mobile UI entry QA'
        type: boolean
        default: false
  push:
    branches: [main, "hardening/**"]
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            v4/package-lock.json
            toss-bridge/package-lock.json
      - name: Install DividendOS tooling
        working-directory: v4
        run: npm ci
      - name: Run FAST quality gate
        working-directory: v4
        run: npm run qa:fast

  core:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            v4/package-lock.json
            toss-bridge/package-lock.json
      - name: Install DividendOS tooling
        working-directory: v4
        run: npm ci
      - name: Run CORE quality gate
        working-directory: v4
        run: npm run qa:core
      - name: Install Toss bridge dependencies
        working-directory: toss-bridge
        run: npm ci
      - name: Verify Toss bridge
        working-directory: toss-bridge
        run: npm run verify
      - name: Build and smoke-test Toss bridge container
        working-directory: toss-bridge
        run: |
          docker build -t dividend-os-toss-bridge:qa .
          docker run --rm -d --name dividend-os-toss-bridge-qa \
            -p 127.0.0.1:18080:8080 \
            -e TOSS_CLIENT_ID=qa-client \
            -e TOSS_CLIENT_SECRET=qa-secret \
            -e FIREBASE_PROJECT_ID=qa-project \
            -e ALLOWED_FIREBASE_UID=qa_owner \
            -e ALLOWED_ORIGIN=https://dttg123.github.io \
            dividend-os-toss-bridge:qa
          trap 'docker logs dividend-os-toss-bridge-qa; docker stop dividend-os-toss-bridge-qa' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/health | grep --quiet '"mode":"read-only"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Audit production dependencies
        working-directory: toss-bridge
        run: npm audit --omit=dev --audit-level=high
      - name: Audit DividendOS dependencies
        working-directory: v4
        run: npm audit --audit-level=high

  android:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install DividendOS tooling
        working-directory: v4
        run: npm ci
      - name: Sync Android project
        working-directory: v4
        run: npm run android:sync
      - name: Build pull-request debug APK
        if: github.event_name == 'pull_request'
        working-directory: v4/android
        run: ./gradlew assembleDebug
      - name: Validate permanent release signing secrets
        if: github.event_name != 'pull_request'
        env:
          DIVIDENDOS_KEYSTORE_BASE64: ${{ secrets.DIVIDENDOS_ANDROID_KEYSTORE_BASE64 }}
          DIVIDENDOS_KEYSTORE_PASSWORD: ${{ secrets.DIVIDENDOS_ANDROID_KEYSTORE_PASSWORD }}
          DIVIDENDOS_KEY_ALIAS: ${{ secrets.DIVIDENDOS_ANDROID_KEY_ALIAS }}
          DIVIDENDOS_KEY_PASSWORD: ${{ secrets.DIVIDENDOS_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$DIVIDENDOS_KEYSTORE_BASE64"
          test -n "$DIVIDENDOS_KEYSTORE_PASSWORD"
          test -n "$DIVIDENDOS_KEY_ALIAS"
          test -n "$DIVIDENDOS_KEY_PASSWORD"
      - name: Prepare permanent release signing key
        if: github.event_name != 'pull_request'
        env:
          DIVIDENDOS_KEYSTORE_BASE64: ${{ secrets.DIVIDENDOS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/dividend-os-signing"
          printf '%s' "$DIVIDENDOS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dividend-os-signing/DividendOS-release.jks"
          chmod 600 "$RUNNER_TEMP/dividend-os-signing/DividendOS-release.jks"
      - name: Build permanently signed release APK
        if: github.event_name != 'pull_request'
        working-directory: v4/android
        env:
          DIVIDENDOS_KEYSTORE_PATH: ${{ runner.temp }}/dividend-os-signing/DividendOS-release.jks
          DIVIDENDOS_KEYSTORE_PASSWORD: ${{ secrets.DIVIDENDOS_ANDROID_KEYSTORE_PASSWORD }}
          DIVIDENDOS_KEY_ALIAS: ${{ secrets.DIVIDENDOS_ANDROID_KEY_ALIAS }}
          DIVIDENDOS_KEY_PASSWORD: ${{ secrets.DIVIDENDOS_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Verify permanent signing certificate
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_CERT_SHA256: 395FA140653EED5E898E64A5317E503C597A95E7C2550085584DF4327B982BAF                
        run: |
          
          APK=v4/android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner \( -type f -o -type l \) | sort -V | tail -n 1)"          
          test -x "$APKSIGNER"
          
          CERT_LINE="$("$APKSIGNER" verify --verbose --print-certs "$APK" | grep -im1 'certificate SHA-256 digest')"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$CERT_LINE" | awk '{print $NF}' | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')"
          printf 'APK signing certificate SHA-256: %s\n' "$ACTUAL_CERT_SHA256"
          test -n "$ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
      - name: Upload pull-request debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DividendOS-Android-debug
          path: v4/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload permanently signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DividendOS-Android-release
          path: v4/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  android-backup:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm run android:sync
        working-directory: v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual Android 16 backup files
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd v4/android && ./gradlew connectedDebugAndroidTest
      - name: Preserve Android file verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-backup-evidence
          path: |
            v4/android/app/build/reports/androidTests
            v4/android/app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - name: Install DividendOS tooling
        working-directory: v4
        run: npm ci
      - name: Install Chromium
        working-directory: v4
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop browser QA
        working-directory: v4
        env:
          QA_LIFETIME_UI: ${{ ((github.event_name == 'workflow_dispatch' && inputs.lifetime_ui) || contains(github.head_ref, 'lifetime-ui') || contains(github.ref_name, 'lifetime-ui')) && '1' || '0' }}
        run: npm run qa:e2e
      - name: Preserve synthetic lifetime UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifetime-ui-evidence
          path: v4/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: v4/test-results
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, e2e, android-backup]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - name: Install DividendOS tooling
        working-directory: v4
        run: npm ci
      - name: Run RELEASE quality gate
        working-directory: v4
        run: npm run qa:release
      - name: Verify Q3 device, restore, rollback, and cleanup evidence
        working-directory: v4
        env:
          QA_RELEASE_EVIDENCE_JSON: ${{ vars.QA_RELEASE_EVIDENCE_JSON }}
        run: npm run qa:release:evidence
