<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f1117">
  <title>DividendOS V4로 이동</title>
  <meta http-equiv="refresh" content="2;url=./v4/">
  <link rel="canonical" href="./v4/">
</head>
<body>
  <p>DividendOS V4로 이동합니다. <a href="./v4/">이동하지 않으면 여기를 누르세요.</a></p>
  <script>
    const target = './v4/' + location.search + location.hash;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=retire-root-r1').finally(() => location.replace(target));
    } else {
      location.replace(target);
    }
  </script>
</body>
</html>
